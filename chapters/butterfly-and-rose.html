<script>
(function(){
"use strict";
// ============================================================ EASY-TO-CHANGE CONSTANTS
const MESSAGE_LINE_1 = "For Beautiful Erlin";
const MESSAGE_LINE_2 = "— by Arief";
const FONT_STACK = '"Great Vibes","Dancing Script","Segoe Script","Brush Script MT",cursive';
const INK = "#5b0d14";            // deep red-brown ink

const WRITE1 = [13.1, 17.2];       // line 1 writing window (s)
const WRITE2 = [17.6, 19.5];       // line 2 writing window (s)
const S_REST = 0.24;               // butterfly scale on the flower (wingspan ~ 210 units, bloom ~ 250)
const S_FLY  = S_REST * 1.65;              // butterfly scale when high above the page (closer to the camera)

// ============================================================ ROSE (drawn into a given <g>)
const Rose = (function(){
const NS = 'http://www.w3.org/2000/svg';
let root = null, defs = null;
function E(tag, attrs, parent) {

let seed = 20261007;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);

const hex = a => '#' + a.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = rgb(a), B = rgb(b); return hex(A.map((v, i) => v + (B[i] - v) * t)); };

const R = { abyss:'#2a0005', deep:'#5a0009', shadow:'#780010', mid:'#c4001c', hi:'#e3192b', glow:'#ff4c3c', lip:'#ff6d57' };

// smooth closed path through points; a point with 3rd element true is a sharp corner
function sm(pts) {

  const f = v => v.toFixed(1);
  let d = `M${f(pts[0][0])},${f(pts[0][1])}`;
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % n], p = pts[(i - 1 + n) % n], q = pts[(i + 2) % n];
    const c1 = a[2] ? a : [a[0] + (b[0] - p[0]) * k, a[1] + (b[1] - p[1]) * k];

}
const poly = pts => 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L') + ' Z';
const line = pts => 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L');

// a band hugging an open edge (upper) pushed toward `side` with sine taper
function band(up, off, side) {
  const n = up.length, lo = [];
  for (let i = 0; i < n; i++) {
    const w = Math.pow(Math.sin(Math.PI * i / (n - 1)), .8);
    const sv = Array.isArray(side[0]) ? side[i] || side[side.length - 1] : side;
    lo.push([up[i][0] + sv[0] * off * w, up[i][1] + sv[1] * off * w]);

  const top = up.map((p, i) => i === 0 || i === n - 1 ? [p[0], p[1], true] : p);
  return sm(top.concat(lo.reverse().slice(1, -1)));
}

function lg(x1, y1, x2, y2, stops) {
  const id = nid('g');
  const g = E('linearGradient', { id, gradientUnits: 'userSpaceOnUse', x1, y1, x2, y2 }, defs);
  stops.forEach(([o, c, op]) => E('stop', { offset: o, 'stop-color': c, 'stop-opacity': op ?? 1 }, g));

}
function clipOf(d) { const id = nid('c'); const cp = E('clipPath', { id }, defs); E('path', { d }, cp); return `url(#${id})`; }

// ------------------------------------------------------------ rose petal
function petal(o) {
  const d = sm(o.pts), L = o.light ?? 1;
  const g = E('g', {});
  const [bx, by] = o.base, [rx, ry] = o.rim;
  const dk = c => mix(c, '#2a0005', 1 - Math.min(1, L));
  const fill = lg(bx, by, rx, ry, [[0, R.deep], [.3, dk(R.shadow)], [.62, dk(R.mid)], [1, mix(dk(R.hi), R.glow, Math.max(0, L - 1) * .8)]]);
  E('path', { d, fill, stroke: R.abyss, 'stroke-width': .7, 'stroke-opacity': .55 }, g);
  const dg = E('g', { 'clip-path': clipOf(d) }, g);

  const nV = o.veins ?? 16;
  const ang = Math.atan2(ry - by, rx - bx), pa = ang + Math.PI / 2;
  for (let i = 0; i < nV; i++) {
    const u = (i / Math.max(1, nV - 1) - .5) * (o.spread ?? 90);
    const x0 = bx + Math.cos(pa) * u * .35, y0 = by + Math.sin(pa) * u * .35;
    const x1 = rx + Math.cos(pa) * u * .8 + (rnd() - .5) * 6, y1 = ry + Math.sin(pa) * u * .8 + (rnd() - .5) * 6;
    const mx = (x0 + x1) / 2 + (rnd() - .5) * 8, my = (y0 + y1) / 2 + (rnd() - .5) * 8;

      stroke: i % 3 ? R.abyss : R.lip, 'stroke-width': i % 3 ? .8 : .6, 'stroke-opacity': i % 3 ? .2 : .13 }, dg);
  }
  (o.blobs || []).forEach(b => E('ellipse', { cx: b.x, cy: b.y, rx: b.rx, ry: b.ry, fill: b.c, opacity: b.o ?? .5,
    filter: `url(#rose_${b.f || 'blur4'})`, transform: b.rot ? `rotate(${b.rot} ${b.x} ${b.y})` : null }, dg));

    const sd0 = o.lip.side || [0, 1], sd = Array.isArray(sd0[0]) ? sd0[Math.floor(sd0.length / 2)] : sd0;
    const ld = band(o.lip.up, o.lip.off, sd0);
    E('path', { d: ld, fill: 'none', stroke: R.abyss, 'stroke-width': 5, 'stroke-opacity': .5, filter: 'url(#rose_blur2)',
      transform: `translate(${sd[0] * 3},${sd[1] * 3})`, 'clip-path': clipOf(d) }, g);
    const mi = o.lip.up[Math.floor(o.lip.up.length / 2)];
    const lf = lg(mi[0], mi[1] - 2, mi[0] + sd[0] * o.lip.off, mi[1] + sd[1] * o.lip.off * 1.2,
      (o.lip.c0 ? [[0, o.lip.c0], [.25, R.glow], [.65, R.hi], [1, R.mid]] : [[0, R.lip], [.45, R.glow], [1, R.mid]]));
    E('path', { d: ld, fill: lf, stroke: R.deep, 'stroke-width': .5, 'stroke-opacity': .5 }, g);
    E('path', { d: line(o.lip.up), fill: 'none', stroke: '#ffb09a', 'stroke-width': .9, 'stroke-opacity': .65, 'stroke-linecap': 'round' }, g);

}

// ------------------------------------------------------------ leaves
function leafletPts(x, y, angDeg, len, wid, teeth, bend) {
  const a = angDeg * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
  const T = (u, v) => [x + u * ca - v * sa, y + u * sa + v * ca];
  const N = 70, up = [], lo = [], mid = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const w = wid * .5 * Math.pow(Math.sin(Math.PI * Math.pow(t, .78)), .8);
    let tu = 1, tl = 1;
    if (teeth && t > .08 && t < .97) {
      const ramp = Math.min(1, (t - .08) * 6);
      tu = 1 + .07 * (1 - ((t * teeth) % 1)) * ramp;
      tl = 1 + .07 * (1 - ((t * teeth + .5) % 1)) * ramp;
    }
    const c = bend * len * t * t;
    up.push(T(t * len, c - w * tu));
    lo.push(T(t * len, c + w * tl));
    mid.push(T(t * len, c));
  }

}
function leaflet(x, y, ang, len, wid, o = {}) {
  const L = o.light ?? 1, bend = o.bend ?? .05;
  const p = leafletPts(x, y, ang, len, wid, o.teeth ?? 16, bend);
  const outline = poly(p.up.concat(p.lo.slice().reverse()));
  const upper = poly(p.mid.concat(p.up.slice().reverse()));
  const g = E('g', {});
  const c0 = mix('#2f5e22', '#000000', Math.max(0, 1 - L) * .6), c1 = mix('#3f7a2c', '#ffffff', Math.max(0, L - 1) * .5);
  const a = p.mid[0], b = p.mid[p.mid.length - 1];
  const f = lg(a[0], a[1], b[0], b[1], [[0, mix(c0, '#1a3010', .3)], [.5, c0], [1, mix(c0, c1, .6)]]);
  E('path', { d: outline, fill: f, stroke: '#1d3a12', 'stroke-width': .6, 'stroke-opacity': .7 }, g);
  const dg = E('g', { 'clip-path': clipOf(outline) }, g);
  E('path', { d: upper, fill: c1, opacity: .55 }, dg);
  const sx = a[0] * .4 + b[0] * .6, sy = a[1] * .4 + b[1] * .6;
  E('ellipse', { cx: sx, cy: sy, rx: len * .3, ry: wid * .14, fill: '#a9d070', opacity: .22 * L, filter: 'url(#rose_blur4)',
    transform: `rotate(${ang} ${sx} ${sy})` }, dg);
  E('path', { d: line(p.mid), fill: 'none', stroke: '#1a3a10', 'stroke-width': 3.2, 'stroke-opacity': .3, filter: 'url(#rose_blur2)' }, dg);
  E('path', { d: line(p.mid), fill: 'none', stroke: '#b9d078', 'stroke-width': 1.5, 'stroke-opacity': .85, 'stroke-linecap': 'round' }, dg);
  const nV = o.veins ?? 7;
  for (let i = 1; i <= nV; i++) {
    const t = .1 + .78 * i / (nV + 1);
    for (const side of [-1, 1]) {
      const m = p.T(t * len, bend * len * t * t);
      const t2 = Math.min(.97, t + .2);
      const w2 = wid * .5 * Math.pow(Math.sin(Math.PI * Math.pow(t2, .78)), .8) * .85;
      const e = p.T(t2 * len, bend * len * t2 * t2 + side * w2);
      const c = p.T((t + .1) * len, bend * len * t * t + side * w2 * .45);
      E('path', { d: `M${m[0]},${m[1]} Q${c[0]},${c[1]} ${e[0]},${e[1]}`, fill: 'none', stroke: '#a8c46c', 'stroke-width': .75, 'stroke-opacity': .5 }, dg);

}

function sepal(x, y, ang, len, wid, bend) {
  const p = leafletPts(x, y, ang, len, wid, 0, bend);
  const o = poly(p.up.concat(p.lo.slice().reverse()));
  const a = p.mid[0], b = p.mid[p.mid.length - 1];
  E('path', { d: o, fill: lg(a[0], a[1], b[0], b[1], [[0, '#5f7f2c'], [.5, '#9dbb4c'], [1, '#c3d870']]), stroke: '#4c6a22', 'stroke-width': .5, 'stroke-opacity': .7 });

}

function draw(g, d) {
root = g; defs = d; uid = 0; seed = 20261007;
const bl = (id, sd, o, s) => { const fl = E('filter', { id: 'rose_' + id, x: o, y: o, width: s, height: s }, defs); E('feGaussianBlur', { stdDeviation: sd }, fl); };

rachis('M258,455 Q232,440 212,430', 2.4);
leaflet(222, 436, -125, 100, 72, { light: .95, bend: .06 });
leaflet(246, 447, 152, 100, 50, { light: .85, bend: -.07 });
leaflet(214, 430, 188, 182, 74, { light: 1.05, bend: .05, veins: 9 });
rachis('M262,418 Q272,405 280,392', 2);
leaflet(268, 410, -40, 64, 38, { light: .9, bend: .08 });
leaflet(250, 428, 12, 80, 26, { light: .8, bend: -.04 });
rachis('M262,468 Q287,444 339,431', 2.6);
leaflet(335, 432, 21, 192, 90, { light: 1.0, bend: .06, veins: 9 });
rachis('M263,500 Q250,498 247,512', 2);
leaflet(250, 514, 172, 128, 64, { light: 1.0, bend: -.05 });
rachis('M262,505 Q270,508 277,514', 2);
leaflet(276, 514, 5, 112, 72, { light: .95, bend: .05 });
rachis('M256,556 Q228,566 197,584', 2.2);
leaflet(197, 584, 188, 110, 42, { light: .9, bend: .05 });

// ---- stem
const STEM = 'M249,244 C249,330 251,420 253,520 C254,580 255,612 256,650 L268,650 C268,612 267,580 266,520 C264,420 263,330 262,244 Z';
const stemFill = lg(0, 245, 0, 650, [[0, '#a0cc5c'], [.3, '#8cbc4f'], [.5, '#719a3a'], [.68, '#5d4a2a'], [1, '#4a2a20']]);
E('path', { d: STEM, fill: stemFill, stroke: '#3d5a1e', 'stroke-width': .5, 'stroke-opacity': .5 });
E('path', { d: 'M252,250 C252,340 254,430 256,520 C257,580 258,612 259,650', fill: 'none', stroke: '#2d4a14', 'stroke-width': 4, 'stroke-opacity': .25, transform: 'translate(5,0)', filter: 'url(#rose_blur2)' });
E('path', { d: 'M252,250 C252,340 253,430 255,500', fill: 'none', stroke: '#d6eb9c', 'stroke-width': 1.8, 'stroke-opacity': .65, 'stroke-linecap': 'round' });

// ---- flower head: open bloom seen almost face-on (rings of cupped petals around a spiral bud)
const HC = [252, 130], GA = -14 * Math.PI / 180, GC = Math.cos(GA), GS = Math.sin(GA), GSX = 1.04, GSY = .9;
const G = (x, y) => { const u = x * GSX, v = y * GSY; return [HC[0] + u * GC - v * GS, HC[1] + u * GS + v * GC]; };

// shadow cast by a petal onto what lies beneath, then the petal itself
function shadowed(pts, opts, sh) {
  E('path', { d: sm(pts), fill: R.abyss, opacity: sh ?? .5, filter: 'url(#rose_blur4)', transform: 'translate(1.5,3)' });

}

function cupPetal(ring, a0, span) {
  const [ox, oy] = ring.off;

  for (let i = 0; i <= M; i++) {

function svgToCanvasURL(str, wpx, hpx){
  return new Promise(function(resolve, reject){
    const doc = new DOMParser().parseFromString(str, 'image/svg+xml');
    if (doc.getElementsByTagName('parsererror').length) { reject(new Error('sprite svg not well-formed')); return; }
    const url = URL.createObjectURL(new Blob([str], { type: 'image/svg+xml' }));
    const im = new Image();
    im.onload = function(){
      try {
        const c = document.createElement('canvas'); c.width = wpx; c.height = hpx;
        c.getContext('2d').drawImage(im, 0, 0, wpx, hpx);
        c.toBlob(function(b){ if (!b) { reject(new Error('toBlob failed')); return; } URL.revokeObjectURL(url); resolve(URL.createObjectURL(b)); }, 'image/png');
      } catch (e) { reject(e); }
    };
    im.onerror = function(){ reject(new Error('svg image failed to load')); };
    im.src = url;
  });
}
function preload(u){ return new Promise(function(res){ const t = new Image(); t.onload = t.onerror = res; t.src = u; }); }

// ------------------------------------------------------------ flight: path, camera, heading (pre-computed at 120 Hz)
const DT = 1/120, NSTEP = Math.ceil((T_END + 0.6) / DT);
const SIM = { x: null, y: null, rot: null, bank: null, cx: null, cy: null, ph: null };
const hOf = t => 1 - ss((t - 8.8) / 3.4);                       // height above the page: 1 in flight, 0 when landed

function crPt(P, i, u){
  const p0 = P[Math.max(0, i-1)], p1 = P[i], p2 = P[i+1], p3 = P[Math.min(P.length-1, i+2)], u2 = u*u, u3 = u2*u, o = [0,0];

}
function precompute(){
  const P = PATH_PTS, samp = []; let acc = 0, prev = null;
  for (let i = 0; i < P.length-1; i++) for (let k = 0; k <= 60; k++){
    if (i > 0 && k === 0) continue;
    const p = crPt(P, i, k/60); if (prev) acc += Math.hypot(p[0]-prev[0], p[1]-prev[1]);
    samp.push([p[0], p[1], acc]); prev = p;
  }
  const total = acc;
  function pathAt(s){
    s = clamp(s, 0, total); let lo = 0, hi = samp.length-1;
    while (hi - lo > 1){ const m = (lo+hi) >> 1; if (samp[m][2] <= s) lo = m; else hi = m; }
    const a = samp[lo], b = samp[hi], u = (s - a[2]) / ((b[2]-a[2]) || 1);
    const a2 = samp[Math.max(0, lo-2)], b2 = samp[Math.min(samp.length-1, hi+2)];
    const tx = b2[0]-a2[0], ty = b2[1]-a2[1];

  }

  const cum = new Float64Array(NSTEP+1); let c = 0;
  for (let i = 0; i <= NSTEP; i++){ const t = i*DT; const v = ss((t-.5)/2.2) * (1 - ss((t-9.0)/3.3)); cum[i] = c; c += v*DT; }

  const X = new Float32Array(NSTEP+1), Y = new Float32Array(NSTEP+1), TA = new Float32Array(NSTEP+1);

    const t = i*DT, p = pathAt(total * cum[i] / cumEnd), h = hOf(t);

    const w = ss((i*DT - 10.4) / 1.5), rest = REST_ANGLE + 360 * Math.round((a - REST_ANGLE) / 360);

  }

  let cx = X[0], cy = Y[0], vx = 0, vy = 0, ang = target[0], av = 0, ph = 0;
  const wc = 5.0, wa = 6.0;
  for (let i = 0; i <= NSTEP; i++){
    const t = i*DT, i0 = Math.max(0, i-1), i1 = Math.min(NSTEP, i+1);
    const bvx = (X[i1]-X[i0]) / ((i1-i0)*DT), bvy = (Y[i1]-Y[i0]) / ((i1-i0)*DT);
    const tx = X[i] + bvx*.25, ty = Y[i] + bvy*.25;

}

const MSG = { w100: [650, 330], ready: false };
let LAYOUT = null;
function computeLayout(){
  W = innerWidth; H = innerHeight;
  const landscape = W / H > .85, L = { landscape: landscape };
  // flight zoom: butterfly (flying, wings open) fills ~46% of the screen height, but never wider than ~78% of the width
  L.zFly = Math.min(.37*H / (570*S_FLY), .78*W / (1000*S_FLY*.9));
  if (landscape){ L.msgW = 470; L.msgX = 335; }
  else { L.msgW = 440; L.msgX = 28 - 220; }
  L.fs1 = L.msgW / MSG.w100[0] * 100; L.fs2 = L.fs1 * .56;
  const blockH = .8*L.fs1 + .95*L.fs1 + .3*L.fs2;
  const top = landscape ? 100 - blockH/2 : 560;
  L.base1 = top + .8*L.fs1; L.base2 = L.base1 + .95*L.fs1;
  const box = { x0: ROSE_BOX.x0, x1: ROSE_BOX.x1, y0: ROSE_BOX.y0, y1: ROSE_BOX.y1 };
  box.x1 = Math.max(box.x1, L.msgX + L.msgW); box.x0 = Math.min(box.x0, L.msgX);
  box.y1 = Math.max(box.y1, L.base2 + .35*L.fs2 + 20);
  L.cfin = [(box.x0 + box.x1)/2, (box.y0 + box.y1)/2];
  L.zFin = Math.min(W * .93 / (box.x1 - box.x0), H * .93 / (box.y1 - box.y0));
  return L;
}

    FAR.push({ el: el, bx: r(), by: r(), vx: -5 + r()*10, vy: 2 + r()*7, ph: r()*6.28, o: big ? .6 : .55 + r()*.45 });
  }
  const shape = 'M0,-1 C.75,-.95 1.05,-.15 .5,.75 L.14,.5 L0,.62 L-.14,.5 L-.5,.75 C-1.05,-.15 -.75,-.95 0,-1Z';
  for (let i = 0; i < 14; i++){
    const red = i % 4 === 3, sz = 9 + r()*13;
    const el = mk('path', { d: shape, fill: red ? 'url(#sc_petalB)' : 'url(#sc_petalA)' }, nearL);
    NEAR.push({ el: el, bx: r(), by: r(), vx: -12 + r()*20, vy: 6 + r()*14, rot: r()*360, rv: (r()-.5)*70, sz: sz, ph: r()*6.28, o: red ? .38 : .5 });
  }
}
function wrapv(v, o, size){ return o + (((v - o) % size) + size) % size; }
function updateParticles(t, cx, cy, z, vis){
  farL.setAttribute('transform', 'translate('+W/2+' '+H/2+') scale('+z*FAR_K+') translate('+(-cx)+' '+(-cy)+')');
  nearL.setAttribute('transform', 'translate('+W/2+' '+H/2+') scale('+z*NEAR_K+') translate('+(-cx)+' '+(-cy)+')');
  farL.setAttribute('opacity', vis.toFixed(3)); nearL.setAttribute('opacity', vis.toFixed(3));
  if (vis <= 0.001) return;
  const fx0 = cx - FAR_TILE[0]/2, fy0 = cy - FAR_TILE[1]/2, nx0 = cx - NEAR_TILE[0]/2, ny0 = cy - NEAR_TILE[1]/2;
  for (const p of FAR){
    const x = wrapv(p.bx*FAR_TILE[0] + fx0 + p.vx*t + 6*Math.sin(t*.7 + p.ph), fx0, FAR_TILE[0]);
    const y = wrapv(p.by*FAR_TILE[1] + fy0 + p.vy*t + 5*Math.cos(t*.6 + p.ph), fy0, FAR_TILE[1]);
    p.el.setAttribute('cx', x.toFixed(1)); p.el.setAttribute('cy', y.toFixed(1)); p.el.setAttribute('opacity', p.o.toFixed(2));
  }
  for (const p of NEAR){
    const x = wrapv(p.bx*NEAR_TILE[0] + nx0 + p.vx*t + 10*Math.sin(t*.9 + p.ph), nx0, NEAR_TILE[0]);
    const y = wrapv(p.by*NEAR_TILE[1] + ny0 + p.vy*t + 8*Math.cos(t*.7 + p.ph), ny0, NEAR_TILE[1]);
    const sx = Math.abs(Math.cos(t*.8 + p.ph))*.5 + .5;
    p.el.setAttribute('transform', 'translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+(p.rot + p.rv*t).toFixed(1)+') scale('+(p.sz*sx).toFixed(1)+' '+p.sz.toFixed(1)+')');
    p.el.setAttribute('opacity', p.o.toFixed(2));
  }
}

// ------------------------------------------------------------ handwriting
const GL = { glyphs: [], lines: [], built: false };
function measureLine(str){
  const m = $('measure'); m.setAttribute('font-family', FONT_STACK); m.setAttribute('font-size', 100); m.textContent = str;
  const n = m.getNumberOfChars(), xs = [], ws = [];
  for (let i = 0; i < n; i++){ xs.push(m.getStartPositionOfChar(i).x); ws.push(m.getExtentOfChar(i).width); }
  return { w: m.getComputedTextLength(), xs: xs, ws: ws, n: n, str: str };
}
function measureMessage(){
  const a = measureLine(MESSAGE_LINE_1), b = measureLine(MESSAGE_LINE_2);
  MSG.w100 = [a.w, b.w]; MSG.a = a; MSG.b = b; MSG.ready = true;
}
function buildText(L){
  txtG.replaceChildren(); GL.glyphs = []; GL.lines = [];
  const lines = [
    { m: MSG.a, fs: L.fs1, base: L.base1, win: WRITE1, x0: L.msgX },
    { m: MSG.b, fs: L.fs2, base: L.base2, win: WRITE2, x0: L.msgX + L.msgW - MSG.b.w * L.fs2 / 100 }
  ];
  lines.forEach(function(ln){
    const sc = ln.fs / 100, gl = [];
    let total = 0;
    for (let i = 0; i < ln.m.n; i++){
      const ch = ln.m.str[i]; if (ch === ' ') { total += ln.m.ws[i] * sc * .6; continue; }
      const adv = ln.m.ws[i] * sc;
      total += adv + ln.fs * .12;
      gl.push({ ch: ch, x: ln.x0 + ln.m.xs[i]*sc, adv: adv, i: i });
    }
    let acc = 0;
    for (let i = 0, gi = 0; i < ln.m.n; i++){
      if (ln.m.str[i] === ' ') { acc += ln.m.ws[i] * sc * .6; continue; }
      const g = gl[gi++], wgt = g.adv + ln.fs * .12;
      g.ts = lerp(ln.win[0], ln.win[1], acc / total); g.td = (ln.win[1] - ln.win[0]) * wgt / total * 1.05;
      acc += wgt;
    }
    gl.forEach(function(g){
      g.len = ln.fs * (1.6 + 4.3 * g.adv / ln.fs);
      g.el = mk('text', { x: g.x.toFixed(2), y: ln.base.toFixed(2), 'font-family': FONT_STACK, 'font-size': ln.fs.toFixed(2),
        fill: INK, 'fill-opacity': 0, stroke: INK, 'stroke-width': (ln.fs * .017).toFixed(2), 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
        'stroke-dasharray': g.len.toFixed(1) + ' ' + (g.len * 40).toFixed(1), 'stroke-dashoffset': g.len.toFixed(1), visibility: 'hidden' }, txtG);
      g.el.textContent = g.ch;
      GL.glyphs.push(g);
    });
    GL.lines.push({ glyphs: gl, win: ln.win, fs: ln.fs, base: ln.base });
  });
  GL.built = true;
}
function updateText(t){
  if (!GL.built) return;
  for (const g of GL.glyphs){
    const p = clamp((t - g.ts) / g.td, 0, 1);
    if (p <= 0) { if (g.vis !== 0) { g.el.setAttribute('visibility', 'hidden'); g.vis = 0; } continue; }
    g.vis = 1; g.el.setAttribute('visibility', 'visible');
    g.el.setAttribute('stroke-dashoffset', (g.len * (1 - p)).toFixed(1));
    g.el.setAttribute('fill-opacity', ss((t - (g.ts + g.td*.75)) / .9).toFixed(3));
  }
  // pen nib follows the glyph being written
  let nib = null, op = 0;
  for (const ln of GL.lines){
    const gs = ln.glyphs, last = gs[gs.length-1];
    if (t < gs[0].ts - .15 || t > last.ts + last.td + .35) continue;
    let cur = gs[0];
    for (const g of gs) if (t >= g.ts) cur = g;
    const p = clamp((t - cur.ts) / cur.td, 0, 1);
    const x = cur.x + cur.adv * (.1 + .85 * p), y = ln.base - ln.fs * (.16 + .22 * (.5 + .5 * Math.sin(p * 8 + cur.i)));
    nib = { x: x, y: y, s: ln.fs / 72 };
    op = clamp(Math.min((t - gs[0].ts + .15) / .2, (last.ts + last.td + .35 - t) / .3), 0, 1);
  }
  if (nib){ nibEl.setAttribute('transform', 'translate('+nib.x.toFixed(1)+' '+nib.y.toFixed(1)+') scale('+nib.s.toFixed(3)+')'); nibEl.setAttribute('opacity', op.toFixed(2)); }
  else nibEl.setAttribute('opacity', 0);
}

// ------------------------------------------------------------ render one moment
function render(t){
  if (!LAYOUT || !BF) return;
  const tt = Math.min(t, T_END);
  const h = hOf(tt), s = S_REST * (1 + .65*h);
  const px = simAt(SIM.x, tt), py = simAt(SIM.y, tt), rot = simAt(SIM.rot, tt), bank = simAt(SIM.bank, tt), ph = simAt(SIM.ph, tt);
  // camera: damped follow -> blended into the final framing while zooming out
  const e = easeIO((tt - 9.0) / 3.4);
  const z = Math.exp(lerp(Math.log(LAYOUT.zFly), Math.log(LAYOUT.zFin), e));
  const cx = lerp(simAt(SIM.cx, tt), LAYOUT.cfin[0], e), cy = lerp(simAt(SIM.cy, tt), LAYOUT.cfin[1], e);
  const tr = 'translate('+W/2+' '+H/2+') scale('+z.toFixed(5)+') translate('+(-cx).toFixed(2)+' '+(-cy).toFixed(2)+')';
  worldA.setAttribute('transform', tr); worldB.setAttribute('transform', tr);
  // wings
  const A = 1 - ss((t - 12.0) / 1.3);
  const flapF = 1 - .86 * Math.pow(.5 - .5*Math.cos(ph), 1.15);
  let pulse = 0; if (t > 14.2){ const tp = (t - 14.2) % 3.2; if (tp < 1.5) pulse = Math.pow(Math.sin(Math.PI * tp / 1.5), 2); }
  const restF = .9 - .5*pulse;
  const f = A * flapF + (1 - A) * restF;
  const bk = bank * A;
  const fl = clamp(f * (1 - .9*bk), .06, 1), fr = clamp(f * (1 + .9*bk), .06, 1);
  BF.L.flap.setAttribute('transform', 'translate(500 0) scale('+fl.toFixed(3)+' 1) translate(-500 0)');
  BF.R.flap.setAttribute('transform', 'translate(500 0) scale('+fr.toFixed(3)+' 1) translate(-500 0)');
  bflyG.setAttribute('transform', 'translate('+px.toFixed(2)+' '+py.toFixed(2)+') rotate('+rot.toFixed(2)+') scale('+s.toFixed(4)+') translate(-500 -290)');
  // soft shadow on the page / petals
  const fm = (fl + fr) / 2;
  shadowEl.setAttribute('transform', 'translate('+(px + 30*h + 1).toFixed(2)+' '+(py + 44*h + 2.5).toFixed(2)+') rotate('+rot.toFixed(2)+') translate(0 '+(120*s).toFixed(2)+') scale('+(1 + .2*h).toFixed(3)+')');
  shadowEl.setAttribute('rx', (480*s*(.18 + .82*fm)).toFixed(2)); shadowEl.setAttribute('ry', (250*s).toFixed(2));
  shadowEl.setAttribute('opacity', (.5 - .3*h).toFixed(3));
  // particles fade away as the camera settles
  updateParticles(t, cx, cy, z, 1 - ss((tt - 10.6) / 3.0));
  updateText(tt);
  vigEl.setAttribute('width', W); vigEl.setAttribute('height', H);
  if (t >= T_END - 1e-6) againBtn.classList.add('show'); else againBtn.classList.remove('show');
}

// ------------------------------------------------------------ boot
let t0 = 0, lastT = DEBUG ? DEBUG_T : 0;
function frame(now){
  const t = (now - t0) / 1000; lastT = t; render(t);
  requestAnimationFrame(frame);
}
function relayout(){
  W = innerWidth; H = innerHeight;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  LAYOUT = computeLayout();
  if (MSG.ready) buildText(LAYOUT);
  render(DEBUG ? DEBUG_T : lastT);
}
async function fontsReady(){
  try {
    await Promise.race([Promise.all([document.fonts.load('80px "Great Vibes"'), document.fonts.ready]), new Promise(function(r){ setTimeout(r, 3500); })]);
  } catch (e) { console.warn('font wait failed', e); }
}
function boot(){
  try {
    buildPaper(); buildRose(); buildButterfly(); buildParticles(); precompute();
  } catch (e) { fail('build failed: ' + (e && e.stack || e)); return; }
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  LAYOUT = computeLayout();
  render(DEBUG ? DEBUG_T : 0);
  // sanity: both drawings must be present
  if (roseLive.childNodes.length < 20 || BF.L.live.childNodes.length < 3 || BF.body.childNodes.length < 5) fail('drawing missing: rose=' + roseLive.childNodes.length + ' wing=' + BF.L.live.childNodes.length + ' body=' + BF.body.childNodes.length);
  window.__sceneReady = true;
  window.__renderAt = function(t){ render(t); };   // used by the MP4 exporter
  againBtn.onclick = function(){ t0 = performance.now(); lastT = 0; againBtn.classList.remove('show'); };
  addEventListener('resize', relayout);
  onRaster = function(){ if (DEBUG) render(DEBUG_T); };
  rasterise(LAYOUT.zFly);
  const fontsP = fontsReady().then(function(){
    try { measureMessage(); LAYOUT = computeLayout(); buildText(LAYOUT); render(DEBUG ? DEBUG_T : lastT); } catch (e) { fail('text build failed: ' + (e && e.stack || e)); }
  });
  if (DEBUG) return;
  // normal play: wait (briefly) for fonts + the pre-rendered bitmaps, then start the clock
  const cap = new Promise(function(r){ setTimeout(r, 6000); });
  Promise.race([Promise.all([fontsP, rasterRoseDone, rasterWingsDone]), cap]).then(function(){
    t0 = performance.now(); requestAnimationFrame(frame);
  });
}
boot();
})();
</script>
